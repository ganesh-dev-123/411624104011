<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Message Manager</h1>
    <input
        type="text"
        id="messageInput"
        placeholder="Enter your message">
    <p id="charCount">Character Count: 0</p>
    <button id="addBtn">Add Message</button>
    <button id="clearBtn">Clear All Messages</button>
    <h3>Messages</h3>
    <div id="messageSection"></div>
    <p id="status"></p>
</div>
<script src="script.js"></script>
</body>
</html>
